name: Update plugin catalog
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins.json
      - README.md
      - scripts/update-catalog.py
      - .github/workflows/update-catalog.yml
permissions:
  contents: write
concurrency:
  group: update-plugin-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh manifest versions
        run: python3 scripts/update-catalog.py --refresh
      - name: Commit updated catalog
        run: |
          git add README.md plugins.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh plugin catalog versions'
          git push
